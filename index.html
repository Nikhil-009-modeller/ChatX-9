<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ChatX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "SF Pro Text",Arial,sans-serif;
  background:#050505;
  color:#fff;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:#fff;
}

.app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.08),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(255,255,255,.06),transparent 35%),
    #050505;
}

/* LOGIN */

.loginScreen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  z-index:50;
}

.loginBox{
  width:min(420px,100%);
  padding:28px;
  border-radius:32px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.logo{
  font-size:34px;
  font-weight:800;
  letter-spacing:-1.5px;
  margin-bottom:5px;
}

.sub{
  color:#aaa;
  margin-bottom:25px;
}

.input{
  width:100%;
  height:52px;
  border-radius:17px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:0 16px;
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:rgba(255,255,255,.35);
}

.primaryBtn{
  width:100%;
  height:52px;
  border-radius:17px;
  background:#fff;
  color:#000;
  font-weight:700;
  margin-top:5px;
}

.secondaryBtn{
  width:100%;
  height:48px;
  margin-top:10px;
  border-radius:16px;
  background:rgba(255,255,255,.08);
}

/* MAIN */

.mainShell{
  position:absolute;
  inset:0;
  display:none;
  transition:
    transform .42s cubic-bezier(.22,.8,.25,1),
    width .42s cubic-bezier(.22,.8,.25,1);
}

.mainShell.drawerOpen{
  transform:scale(.91) translateX(-3%);
}

.topbar{
  height:80px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 18px 8px;
}

.title{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1px;
}

.profileMini{
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  cursor:pointer;
}

.page{
  position:absolute;
  inset:80px 0 85px;
  overflow:auto;
  padding:10px 17px 30px;
}

.page::-webkit-scrollbar{
  display:none;
}

/* SEARCH */

.search{
  width:100%;
  height:50px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.065);
  color:#fff;
  outline:none;
  padding:0 17px;
  margin-bottom:16px;
}

/* CARDS */

.userCard{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px;
  margin-bottom:10px;
  border-radius:22px;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  cursor:pointer;
}

.avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.22),
    rgba(255,255,255,.06)
  );
  border:1px solid rgba(255,255,255,.13);
  font-weight:800;
}

.userInfo{
  min-width:0;
}

.userName{
  font-weight:700;
  font-size:16px;
}

.userEmail{
  color:#8d8d8d;
  font-size:13px;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* PROFILE */

.profilePage{
  text-align:center;
}

.bigAvatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:15px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.2),
    rgba(255,255,255,.05)
  );
  border:1px solid rgba(255,255,255,.15);
}

.profileName{
  font-size:23px;
  font-weight:800;
}

.profileEmail{
  color:#888;
  margin-top:4px;
}

.profileRows{
  margin-top:25px;
  text-align:left;
}

.profileRow{
  padding:16px;
  border-radius:18px;
  margin-bottom:9px;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08);
}

.rowLabel{
  font-size:12px;
  color:#888;
  margin-bottom:5px;
}

.rowValue{
  font-size:15px;
}

.logout{
  width:100%;
  height:50px;
  margin-top:12px;
  border-radius:17px;
  background:rgba(255,70,70,.14);
  color:#ff8585;
}

/* BOTTOM NAV */

.bottomNav{
  position:absolute;
  left:15px;
  right:15px;
  bottom:13px;
  height:64px;
  border-radius:25px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  display:flex;
  align-items:center;
  padding:5px;
}

.navPill{
  position:absolute;
  height:54px;
  width:calc((100% - 10px)/3);
  border-radius:20px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.08);
  transition:left .38s cubic-bezier(.22,.8,.25,1);
}

.navItem{
  position:relative;
  z-index:2;
  flex:1;
  height:54px;
  background:transparent;
  color:#999;
  font-size:13px;
  font-weight:650;
}

.navItem.active{
  color:#fff;
}

/* OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.35);
  opacity:0;
  pointer-events:none;
  transition:opacity .35s;
  z-index:15;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* CHAT DRAWER */

.chatDrawer{
  position:absolute;
  top:0;
  right:0;
  width:min(94%,460px);
  height:100%;
  z-index:20;
  transform:translateX(105%);
  transition:transform .42s cubic-bezier(.22,.8,.25,1);
  background:rgba(18,18,18,.70);
  border-left:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(35px);
  -webkit-backdrop-filter:blur(35px);
  display:flex;
  flex-direction:column;
}

.chatDrawer.open{
  transform:translateX(0);
}

.chatHeader{
  height:82px;
  flex:0 0 82px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.backBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  font-size:21px;
}

.chatUser{
  flex:1;
}

.chatUserName{
  font-weight:800;
  font-size:17px;
}

.chatStatus{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  touch-action:pan-y;
}

.messages::-webkit-scrollbar{
  display:none;
}

.msg{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  line-height:1.35;
  font-size:15px;
  word-break:break-word;
}

.msg.mine{
  align-self:flex-end;
  background:#fff;
  color:#000;
  border-bottom-right-radius:5px;
}

.msg.theirs{
  align-self:flex-start;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.composer{
  flex:0 0 auto;
  padding:10px 12px 14px;
  display:flex;
  gap:8px;
  background:rgba(0,0,0,.15);
}

.messageInput{
  flex:1;
  min-width:0;
  height:48px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:0 15px;
}

.sendBtn{
  width:50px;
  height:48px;
  border-radius:18px;
  background:#fff;
  color:#000;
  font-weight:800;
  font-size:18px;
}

.attachBtn{
  width:45px;
  height:48px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  font-size:19px;
}

/* EDGE ZONE */

.edgeZone{
  position:absolute;
  top:0;
  right:0;
  width:68px;
  height:100%;
  z-index:12;
  touch-action:none;
}

/* TOAST */

.toast{
  position:absolute;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(15px);
  padding:11px 16px;
  border-radius:15px;
  background:rgba(25,25,25,.9);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  max-width:85%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* HIDDEN */

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->

  <section id="loginScreen" class="loginScreen">

    <div class="loginBox">

      <div class="logo">ChatX</div>
      <div class="sub">Private messaging, simplified.</div>

      <input
        id="usernameInput"
        class="input"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="emailInput"
        class="input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        class="input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginBtn" class="primaryBtn">
        Login
      </button>

      <button id="signupBtn" class="secondaryBtn">
        Create Account
      </button>

    </div>

  </section>


  <!-- MAIN APP -->

  <main id="mainShell" class="mainShell">

    <header class="topbar">

      <div id="pageTitle" class="title">
        Home
      </div>

      <button id="profileMini" class="profileMini">
        ?
      </button>

    </header>


    <!-- HOME -->

    <section id="homePage" class="page">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search users..."
      >

      <div id="usersList"></div>

    </section>


    <!-- PROFILE -->

    <section id="profilePage" class="page profilePage hidden">

      <div id="bigAvatar" class="bigAvatar">
        ?
      </div>

      <div id="profileName" class="profileName">
        User
      </div>

      <div id="profileEmail" class="profileEmail">
        -
      </div>

      <div class="profileRows">

        <div class="profileRow">
          <div class="rowLabel">Username</div>
          <div id="profileUsernameRow" class="rowValue">-</div>
        </div>

        <div class="profileRow">
          <div class="rowLabel">Email</div>
          <div id="profileEmailRow" class="rowValue">-</div>
        </div>

        <div class="profileRow">
          <div class="rowLabel">Account</div>
          <div class="rowValue">ChatX Member</div>
        </div>

      </div>

      <button id="logoutBtn" class="logout">
        Logout
      </button>

    </section>


    <!-- NAV -->

    <nav class="bottomNav">

      <div id="navPill" class="navPill"></div>

      <button
        id="navHome"
        class="navItem active"
      >
        Home
      </button>

      <button
        id="navChat"
        class="navItem"
      >
        Chat
      </button>

      <button
        id="navProfile"
        class="navItem"
      >
        Profile
      </button>

    </nav>

  </main>


  <!-- BACKDROP -->

  <div id="overlay" class="overlay"></div>


  <!-- CHAT DRAWER -->

  <aside id="chatDrawer" class="chatDrawer">

    <header class="chatHeader">

      <button id="backChatBtn" class="backBtn">
        ‹
      </button>

      <div class="avatar" id="chatAvatar">
        ?
      </div>

      <div class="chatUser">

        <div id="chatUserName" class="chatUserName">
          Chat
        </div>

        <div class="chatStatus">
          Messages
        </div>

      </div>

    </header>


    <div id="messages" class="messages"></div>


    <div class="composer">

      <button
        id="attachBtn"
        class="attachBtn"
        type="button"
      >
        +
      </button>

      <input
        id="messageInput"
        class="messageInput"
        type="text"
        placeholder="Message..."
        autocomplete="off"
      >

      <button
        id="sendBtn"
        class="sendBtn"
        type="button"
      >
        ↑
      </button>

    </div>

  </aside>


  <!-- RIGHT EDGE SWIPE AREA -->

  <div id="edgeZone" class="edgeZone"></div>


  <!-- TOAST -->

  <div id="toast" class="toast"></div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ktzlnjehfbjzrqtgwxee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sxrL1sGY22smdk3uSd1F1g_wdEngxGA";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   STATE
========================================= */

let currentUser = null;
let currentProfile = null;
let selectedUser = null;
let realtimeChannel = null;
let currentPage = "home";

let drawerStartX = 0;
let drawerDragging = false;

let edgeStartX = 0;
let edgeDragging = false;


/* =========================================
   ELEMENTS
========================================= */

const loginScreen =
  document.getElementById("loginScreen");

const mainShell =
  document.getElementById("mainShell");

const usernameInput =
  document.getElementById("usernameInput");

const emailInput =
  document.getElementById("emailInput");

const passwordInput =
  document.getElementById("passwordInput");

const loginBtn =
  document.getElementById("loginBtn");

const signupBtn =
  document.getElementById("signupBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const usersList =
  document.getElementById("usersList");

const searchInput =
  document.getElementById("searchInput");

const profileMini =
  document.getElementById("profileMini");

const navPill =
  document.getElementById("navPill");

const navHome =
  document.getElementById("navHome");

const navChat =
  document.getElementById("navChat");

const navProfile =
  document.getElementById("navProfile");

const homePage =
  document.getElementById("homePage");

const profilePage =
  document.getElementById("profilePage");

const pageTitle =
  document.getElementById("pageTitle");

const overlay =
  document.getElementById("overlay");

const chatDrawer =
  document.getElementById("chatDrawer");

const edgeZone =
  document.getElementById("edgeZone");

const backChatBtn =
  document.getElementById("backChatBtn");

const chatAvatar =
  document.getElementById("chatAvatar");

const chatUserName =
  document.getElementById("chatUserName");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const attachBtn =
  document.getElementById("attachBtn");

const toast =
  document.getElementById("toast");


/* =========================================
   TOAST
========================================= */

let toastTimer;

function toastMessage(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {

    toast.classList.remove("show");

  },2500);
}


/* =========================================
   PROFILE
========================================= */

function getInitial(name){

  if(!name) return "?";

  return name
    .trim()
    .charAt(0)
    .toUpperCase();
}


async function loadProfile(){

  if(!currentUser) return;

  const { data,error } = await db
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){

    console.error("PROFILE LOAD ERROR:",error);

  }

  if(data){

    currentProfile = data;

  }else{

    const username =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "User";

    const { data:newProfile,error:createError } =
      await db
        .from("profiles")
        .upsert({
          id:currentUser.id,
          username:username
        })
        .select()
        .maybeSingle();

    if(createError){

      console.error(
        "PROFILE CREATE ERROR:",
        createError
      );

      currentProfile = {
        id:currentUser.id,
        username:username
      };

    }else{

      currentProfile = newProfile;

    }

  }

  updateProfileUI();
}


function updateProfileUI(){

  if(!currentUser) return;

  const username =
    currentProfile?.username ||
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const initial = getInitial(username);

  profileMini.textContent = initial;

  document.getElementById("bigAvatar").textContent =
    initial;

  document.getElementById("profileName").textContent =
    username;

  document.getElementById("profileEmail").textContent =
    currentUser.email || "-";

  document.getElementById("profileUsernameRow").textContent =
    username;

  document.getElementById("profileEmailRow").textContent =
    currentUser.email || "-";

}


/* =========================================
   ENTER APP
========================================= */

async function enterApp(){

  loginScreen.classList.add("hidden");

  mainShell.style.display = "block";

  await loadProfile();

  await loadUsers();

  showPage("home");
}


/* =========================================
   SIGNUP
========================================= */

async function signup(){

  const username =
    usernameInput.value.trim();

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!username){

    toastMessage("Enter username");

    return;
  }

  if(!email){

    toastMessage("Enter email");

    return;
  }

  if(!password){

    toastMessage("Enter password");

    return;
  }

  if(password.length < 6){

    toastMessage("Password must be 6+ characters");

    return;
  }

  signupBtn.disabled = true;

  const { data,error } =
    await db.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          username:username
        }
      }

    });

  signupBtn.disabled = false;

  if(error){

    console.error("SIGNUP ERROR:",error);

    toastMessage(error.message);

    return;
  }

  if(data.user){

    const { error:profileError } =
      await db
        .from("profiles")
        .upsert({
          id:data.user.id,
          username:username
        });

    if(profileError){

      console.error(
        "PROFILE INSERT ERROR:",
        profileError
      );

    }

  }

  toastMessage("Account created");

  if(data.session){

    currentUser = data.user;

    await enterApp();

  }else{

    toastMessage(
      "Account created. Please login."
    );

  }

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if(!email){

    toastMessage("Enter email");

    return;
  }

  if(!password){

    toastMessage("Enter password");

    return;
  }

  loginBtn.disabled = true;

  const { data,error } =
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });

  loginBtn.disabled = false;

  if(error){

    console.error("LOGIN ERROR:",error);

    toastMessage(error.message);

    return;
  }

  currentUser = data.user;

  await enterApp();

}


/* =========================================
   USERS
========================================= */

async function loadUsers(){

  if(!currentUser) return;

  const { data,error } =
    await db
      .from("profiles")
      .select("id,username,created_at")
      .neq("id",currentUser.id)
      .order("username",{ascending:true});

  if(error){

    console.error("USERS ERROR:",error);

    toastMessage(
      "Users load error: " + error.message
    );

    return;
  }

  renderUsers(data || []);

}


function renderUsers(list){

  usersList.innerHTML = "";

  if(!list.length){

    usersList.innerHTML = `
      <div style="
        text-align:center;
        color:#777;
        padding:40px 10px;
      ">
        No other users yet.
      </div>
    `;

    return;
  }

  list.forEach(user => {

    const card =
      document.createElement("div");

    card.className = "userCard";

    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      getInitial(user.username);

    const info =
      document.createElement("div");

    info.className = "userInfo";

    const name =
      document.createElement("div");

    name.className = "userName";

    name.textContent =
      user.username || "User";

    const email =
      document.createElement("div");

    email.className = "userEmail";

    email.textContent =
      "Tap to select";

    info.appendChild(name);

    info.appendChild(email);

    card.appendChild(avatar);

    card.appendChild(info);

    /*
      IMPORTANT:
      Card tap only SELECTS user.
      It DOES NOT open chat.
    */

    card.addEventListener("click",() => {

      selectedUser = user;

      document
        .querySelectorAll(".userCard")
        .forEach(c =>
          c.style.borderColor =
            "rgba(255,255,255,.08)"
        );

      card.style.borderColor =
        "rgba(255,255,255,.4)";

      toastMessage(
        user.username + " selected"
      );

    });

    usersList.appendChild(card);

  });

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  async () => {

    const q =
      searchInput.value
        .trim()
        .toLowerCase();

    const { data,error } =
      await db
        .from("profiles")
        .select("id,username,created_at")
        .neq("id",currentUser.id)
        .order("username",{ascending:true});

    if(error) return;

    const filtered =
      (data || []).filter(user =>
        (user.username || "")
          .toLowerCase()
          .includes(q)
      );

    renderUsers(filtered);

  }
);


/* =========================================
   PAGE NAV
========================================= */

function moveSlider(page){

  const items =
    Array.from(
      document.querySelectorAll(".navItem")
    );

  let index = 0;

  if(page === "home")
    index = 0;

  if(page === "chat")
    index = 1;

  if(page === "profile")
    index = 2;

  const item = items[index];

  if(!item) return;

  navPill.style.left =
    item.offsetLeft + "px";

}


function showPage(page){

  currentPage = page;

  homePage.classList.add("hidden");

  profilePage.classList.add("hidden");

  navHome.classList.remove("active");

  navChat.classList.remove("active");

  navProfile.classList.remove("active");


  if(page === "home"){

    homePage.classList.remove("hidden");

    navHome.classList.add("active");

    pageTitle.textContent = "Home";

  }


  if(page === "profile"){

    profilePage.classList.remove("hidden");

    navProfile.classList.add("active");

    pageTitle.textContent = "Profile";

    updateProfileUI();

  }


  /*
    Chat button DOES NOT open chat.
    Chat opens only with right-edge swipe.
  */

  if(page === "chat"){

    toastMessage(
      "Swipe from the right edge to open Chat"
    );

    page = "home";

    homePage.classList.remove("hidden");

    navHome.classList.add("active");

    pageTitle.textContent = "Home";

  }


  requestAnimationFrame(() => {

    moveSlider(page);

  });

}


navHome.addEventListener(
  "click",
  () => showPage("home")
);

navProfile.addEventListener(
  "click",
  () => showPage("profile")
);

navChat.addEventListener(
  "click",
  () => showPage("chat")
);

profileMini.addEventListener(
  "click",
  () => showPage("profile")
);


/* =========================================
   OPEN CHAT
========================================= */

async function openChat(){

  if(!selectedUser){

    toastMessage(
      "Select a user first"
    );

    return;
  }

  chatUserName.textContent =
    selectedUser.username || "User";

  chatAvatar.textContent =
    getInitial(selectedUser.username);

  mainShell.classList.add("drawerOpen");

  overlay.classList.add("show");

  chatDrawer.classList.add("open");

  /*
    Edge zone disabled while drawer is open
  */

  edgeZone.style.display = "none";

  await loadMessages();

  subscribeRealtime();

}


/* =========================================
   CLOSE CHAT
========================================= */

function closeChat(){

  chatDrawer.classList.remove("open");

  overlay.classList.remove("show");

  mainShell.classList.remove("drawerOpen");

  edgeZone.style.display = "block";

  if(realtimeChannel){

    db.removeChannel(realtimeChannel);

    realtimeChannel = null;

  }

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages(){

  if(!currentUser || !selectedUser)
    return;

  messages.innerHTML = "";

  const { data,error } =
    await db
      .from("messages")
      .select(
        "id,sender_id,receiver_id,content,created_at"
      )
      .or(
        "and(sender_id.eq." +
        currentUser.id +
        ",receiver_id.eq." +
        selectedUser.id +
        "),and(sender_id.eq." +
        selectedUser.id +
        ",receiver_id.eq." +
        currentUser.id +
        ")"
      )
      .order(
        "created_at",
        {ascending:true}
      );

  if(error){

    console.error(
      "LOAD MESSAGES ERROR:",
      error
    );

    toastMessage(
      "Messages error: " +
      error.message
    );

    return;
  }

  (data || []).forEach(
    message => renderMessage(message)
  );

  scrollMessages();

}


/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(message){

  const div =
    document.createElement("div");

  div.className =
    "msg " +
    (
      message.sender_id === currentUser.id
        ? "mine"
        : "theirs"
    );

  /*
    textContent = safe
    No HTML injection.
  */

  div.textContent =
    message.content;

  messages.appendChild(div);

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  console.log("SEND CLICK");

  if(!currentUser){

    toastMessage(
      "Login required"
    );

    return;
  }

  if(!selectedUser){

    toastMessage(
      "Select a user first"
    );

    return;
  }

  const content =
    messageInput.value.trim();

  if(!content)
    return;


  sendBtn.disabled = true;


  console.log("SENDING:",{
    sender_id:currentUser.id,
    receiver_id:selectedUser.id,
    content:content
  });


  /*
    IMPORTANT FIX:
    NO .select()
    NO .single()

    This avoids RLS RETURNING issues.
  */

  const { error } =
    await db
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          selectedUser.id,

        content:
          content

      });


  sendBtn.disabled = false;


  if(error){

    console.error(
      "MESSAGE SEND ERROR:",
      error
    );

    toastMessage(
      "Send Error: " +
      error.message
    );

    return;
  }


  /*
    Clear composer
  */

  messageInput.value = "";


  /*
    Reload database messages
  */

  await loadMessages();

  scrollMessages();

}


/* =========================================
   ENTER TO SEND
========================================= */

messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================
   ATTACHMENT
========================================= */

attachBtn.addEventListener(
  "click",
  () => {

    toastMessage(
      "Attachments coming soon"
    );

  }
);


/* =========================================
   SCROLL
========================================= */

function scrollMessages(){

  requestAnimationFrame(() => {

    messages.scrollTop =
      messages.scrollHeight;

  });

}


/* =========================================
   REALTIME
========================================= */

function subscribeRealtime(){

  if(!currentUser || !selectedUser)
    return;


  if(realtimeChannel){

    db.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    db
      .channel(
        "chat-" +
        currentUser.id +
        "-" +
        selectedUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload => {

          const msg =
            payload.new;

          const isCurrentChat =
            (
              msg.sender_id ===
                currentUser.id &&
              msg.receiver_id ===
                selectedUser.id
            )
            ||
            (
              msg.sender_id ===
                selectedUser.id &&
              msg.receiver_id ===
                currentUser.id
            );

          if(!isCurrentChat)
            return;

          /*
            Avoid duplicate visual message
            because loadMessages can also run.
          */

          const exists =
            Array.from(
              messages.children
            ).some(
              el =>
                el.dataset.id ==
                String(msg.id)
            );

          if(exists)
            return;

          const div =
            document.createElement("div");

          div.dataset.id =
            String(msg.id);

          div.className =
            "msg " +
            (
              msg.sender_id ===
              currentUser.id
                ? "mine"
                : "theirs"
            );

          div.textContent =
            msg.content;

          messages.appendChild(div);

          scrollMessages();

        }
      )
      .subscribe();

}


/* =========================================
   RIGHT EDGE SWIPE OPEN
========================================= */

edgeZone.addEventListener(
  "touchstart",
  event => {

    if(chatDrawer.classList.contains("open"))
      return;

    edgeDragging = true;

    edgeStartX =
      event.touches[0].clientX;

  },
  {passive:true}
);


edgeZone.addEventListener(
  "touchmove",
  event => {

    if(!edgeDragging)
      return;

    /*
      Prevent page movement
      while opening drawer.
    */

    event.preventDefault();

  },
  {passive:false}
);


edgeZone.addEventListener(
  "touchend",
  event => {

    if(!edgeDragging)
      return;

    const endX =
      event.changedTouches[0].clientX;

    const dx =
      endX - edgeStartX;

    edgeDragging = false;

    /*
      Right -> Left
      dx must be negative.
    */

    if(dx < -55){

      openChat();

    }

  }
);


/* =========================================
   CHAT DRAWER SWIPE CLOSE
========================================= */

chatDrawer.addEventListener(
  "touchstart",
  event => {

    const target =
      event.target;

    /*
      Don't steal gestures from
      buttons, inputs or message scroll.
    */

    if(
      target.closest("button") ||
      target.closest("input") ||
      target.closest(".messages")
    ){

      drawerDragging = false;

      return;

    }

    drawerDragging = true;

    drawerStartX =
      event.touches[0].clientX;

  },
  {passive:true}
);


chatDrawer.addEventListener(
  "touchend",
  event => {

    if(!drawerDragging)
      return;

    const endX =
      event.changedTouches[0].clientX;

    const dx =
      endX - drawerStartX;

    drawerDragging = false;

    /*
      Left -> Right
      Close drawer.
    */

    if(dx > 90){

      closeChat();

    }

  }
);


/* =========================================
   BUTTONS
========================================= */

backChatBtn.addEventListener(
  "click",
  closeChat
);

overlay.addEventListener(
  "click",
  closeChat
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    if(realtimeChannel){

      db.removeChannel(
        realtimeChannel
      );

      realtimeChannel = null;

    }

    await db.auth.signOut();

    currentUser = null;

    currentProfile = null;

    selectedUser = null;

    closeChat();

    mainShell.style.display = "none";

    loginScreen.classList.remove(
      "hidden"
    );

    usernameInput.value = "";

    emailInput.value = "";

    passwordInput.value = "";

    toastMessage("Logged out");

  }
);


/* =========================================
   AUTH STATE
========================================= */

db.auth.onAuthStateChange(
  async (event,session) => {

    if(session?.user){

      currentUser =
        session.user;

      if(
        loginScreen &&
        !loginScreen.classList.contains(
          "hidden"
        )
      ){

        await enterApp();

      }

    }

  }
);


/* =========================================
   INITIAL SESSION
========================================= */

(async function(){

  const { data } =
    await db.auth.getSession();

  if(data?.session?.user){

    currentUser =
      data.session.user;

    await enterApp();

  }

})();


/* =========================================
   LOGIN EVENTS
========================================= */

loginBtn.addEventListener(
  "click",
  login
);

signupBtn.addEventListener(
  "click",
  signup
);


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
  "resize",
  () => {

    moveSlider(currentPage);

  }
);

</script>
