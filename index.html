<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ChatX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",sans-serif;
  background:#050505;
  color:#fff;
}

body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.08),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(255,255,255,.05),transparent 35%),
    #050505;
}

/* ================= APP ================= */

#app{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* ================= GLASS ================= */

.glass{
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.06);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
}

/* ================= AUTH ================= */

#authPage{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.authBox{
  width:100%;
  max-width:390px;
  padding:28px;
  border-radius:32px;
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:800;
  letter-spacing:-1.5px;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#999;
  font-size:14px;
  margin-bottom:28px;
}

.input{
  width:100%;
  height:52px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#fff;
  border-radius:17px;
  outline:none;
  padding:0 16px;
  margin-bottom:12px;
  font-size:15px;
}

.input:focus{
  border-color:rgba(255,255,255,.35);
}

.btn{
  width:100%;
  height:52px;
  border:none;
  border-radius:17px;
  background:#fff;
  color:#000;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  margin-top:4px;
}

.btn.secondary{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
}

.authSwitch{
  text-align:center;
  margin-top:18px;
  color:#888;
  font-size:13px;
}

.authSwitch span{
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

#errorBox{
  display:none;
  margin-bottom:12px;
  padding:11px 13px;
  border-radius:13px;
  background:rgba(255,70,70,.12);
  border:1px solid rgba(255,70,70,.2);
  color:#ff8b8b;
  font-size:13px;
}

/* ================= MAIN SHELL ================= */

#mainShell{
  position:absolute;
  inset:0;
  transition:
    transform .48s cubic-bezier(.22,1,.36,1),
    width .48s cubic-bezier(.22,1,.36,1);
}

#mainShell.chatOpen{
  transform:scale(.92) translateX(-4%);
}

/* ================= HEADER ================= */

.header{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px;
}

.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.headerIcon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* ================= PAGES ================= */

.page{
  position:absolute;
  top:90px;
  left:0;
  right:0;
  bottom:92px;
  padding:0 18px 20px;
  overflow-y:auto;
  scrollbar-width:none;
}

.page::-webkit-scrollbar{
  display:none;
}

.page.hidden{
  display:none;
}

/* ================= HOME ================= */

.welcome{
  margin:8px 0 20px;
}

.welcome h1{
  margin:0;
  font-size:32px;
  letter-spacing:-1.3px;
}

.welcome p{
  margin:6px 0 0;
  color:#8e8e8e;
}

.searchBox{
  width:100%;
  height:50px;
  border-radius:18px;
  padding:0 16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  outline:none;
  font-size:14px;
  margin-bottom:16px;
}

.sectionTitle{
  color:#777;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1.4px;
  margin:18px 4px 10px;
}

.userCard{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px;
  border-radius:21px;
  margin-bottom:9px;
  cursor:pointer;
}

.userCard:active{
  transform:scale(.98);
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(135deg,#444,#111);
  border:1px solid rgba(255,255,255,.15);
  font-weight:700;
  flex-shrink:0;
}

.userInfo{
  min-width:0;
  flex:1;
}

.username{
  font-size:15px;
  font-weight:700;
}

.userStatus{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

/* ================= PROFILE ================= */

.profileBox{
  padding:25px;
  border-radius:30px;
  text-align:center;
}

.bigAvatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
  background:linear-gradient(135deg,#555,#111);
  border:1px solid rgba(255,255,255,.16);
}

.profileName{
  font-size:22px;
  font-weight:800;
}

.profileEmail{
  color:#777;
  margin-top:5px;
  font-size:13px;
}

.logout{
  margin-top:25px;
}

/* ================= BOTTOM NAV ================= */

.bottomNav{
  position:absolute;
  bottom:15px;
  left:15px;
  right:15px;
  height:64px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:5px;
  z-index:20;
}

.navItem{
  position:relative;
  flex:1;
  height:54px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  cursor:pointer;
  z-index:2;
  font-size:12px;
  font-weight:600;
}

.navItem.active{
  color:#fff;
}

.navPill{
  position:absolute;
  top:5px;
  bottom:5px;
  width:calc(33.333% - 10px);
  border-radius:19px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.1);
  transition:
    transform .45s cubic-bezier(.22,1,.36,1);
  z-index:1;
}

/* ================= CHAT OVERLAY ================= */

#chatOverlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
  z-index:50;
}

#chatOverlay.open{
  opacity:1;
  pointer-events:auto;
}

/* ================= CHAT DRAWER ================= */

#chatDrawer{
  position:absolute;
  top:0;
  right:0;
  width:min(440px,94vw);
  height:100%;
  z-index:60;

  background:rgba(17,17,17,.72);
  border-left:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(38px);
  -webkit-backdrop-filter:blur(38px);

  transform:translateX(105%);
  transition:
    transform .48s cubic-bezier(.22,1,.36,1);

  display:flex;
  flex-direction:column;
}

#chatDrawer.open{
  transform:translateX(0);
}

/* ================= CHAT HEADER ================= */

.chatHeader{
  height:85px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.backBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  flex-shrink:0;
}

.chatUser{
  flex:1;
  min-width:0;
}

.chatUserName{
  font-size:16px;
  font-weight:750;
}

.chatUserStatus{
  font-size:11px;
  color:#777;
  margin-top:3px;
}

/* ================= MESSAGES ================= */

#messages{
  flex:1;
  overflow-y:auto;
  padding:20px 15px;
  display:flex;
  flex-direction:column;
  gap:8px;
  touch-action:pan-y;
  scrollbar-width:none;
}

#messages::-webkit-scrollbar{
  display:none;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  font-size:14px;
  line-height:1.35;
  word-wrap:break-word;
  animation:messageIn .22s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(7px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.message.mine{
  align-self:flex-end;
  background:#fff;
  color:#000;
  border-bottom-right-radius:6px;
}

.message.theirs{
  align-self:flex-start;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:6px;
}

.messageTime{
  font-size:9px;
  opacity:.5;
  margin-top:4px;
  text-align:right;
}

/* ================= COMPOSER ================= */

.composer{
  padding:10px 12px 14px;
  display:flex;
  gap:8px;
  border-top:1px solid rgba(255,255,255,.08);
}

.messageInput{
  flex:1;
  min-width:0;
  height:48px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
  outline:none;
  background:rgba(255,255,255,.07);
  color:#fff;
  padding:0 15px;
  font-size:14px;
}

.sendBtn{
  width:48px;
  height:48px;
  border-radius:18px;
  border:none;
  background:#fff;
  color:#000;
  font-size:18px;
  cursor:pointer;
}

/* ================= EDGE ZONE ================= */

#edgeZone{
  position:absolute;
  top:0;
  right:0;
  width:70px;
  height:100%;
  z-index:45;
  touch-action:none;
}

/* ================= TOAST ================= */

#toast{
  position:absolute;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(20px);
  padding:11px 16px;
  border-radius:15px;
  background:rgba(30,30,30,.88);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:100;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= LOADING ================= */

#loading{
  position:absolute;
  inset:0;
  background:#050505;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
}

.loader{
  width:30px;
  height:30px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.hidden{
  display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .authBox{
    padding:23px;
  }

  .welcome h1{
    font-size:29px;
  }

  #chatDrawer{
    width:94vw;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- LOADING -->
  <div id="loading">
    <div class="loader"></div>
    <div style="color:#777;font-size:12px;">Loading ChatX...</div>
  </div>


  <!-- ================= AUTH ================= -->

  <section id="authPage">

    <div class="authBox glass">

      <div class="logo">ChatX</div>

      <div class="subtitle">
        Simple. Private. Connected.
      </div>

      <div id="errorBox"></div>

      <!-- LOGIN -->

      <div id="loginForm">

        <input
          id="loginEmail"
          class="input"
          type="email"
          placeholder="Email"
          autocomplete="email">

        <input
          id="loginPassword"
          class="input"
          type="password"
          placeholder="Password"
          autocomplete="current-password">

        <button class="btn" id="loginBtn">
          Login
        </button>

        <div class="authSwitch">
          Don't have an account?
          <span id="showSignup">Create Account</span>
        </div>

      </div>


      <!-- SIGNUP -->

      <div id="signupForm" class="hidden">

        <input
          id="signupUsername"
          class="input"
          type="text"
          placeholder="Username"
          maxlength="30"
          autocomplete="username">

        <input
          id="signupEmail"
          class="input"
          type="email"
          placeholder="Email"
          autocomplete="email">

        <input
          id="signupPassword"
          class="input"
          type="password"
          placeholder="Password"
          autocomplete="new-password">

        <button class="btn" id="signupBtn">
          Create Account
        </button>

        <div class="authSwitch">
          Already have an account?
          <span id="showLogin">Login</span>
        </div>

      </div>

    </div>

  </section>


  <!-- ================= MAIN ================= -->

  <div id="mainShell" class="hidden">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">
        ChatX
      </div>

      <div class="headerIcon glass" id="headerProfile">
        ◉
      </div>

    </header>


    <!-- ================= HOME ================= -->

    <main id="homePage" class="page">

      <div class="welcome">
        <h1 id="helloText">
          Hello 👋
        </h1>

        <p>
          Find someone and start chatting.
        </p>
      </div>


      <input
        id="searchInput"
        class="searchBox"
        type="text"
        placeholder="Search username...">


      <div class="sectionTitle">
        Users
      </div>


      <div id="userResults"></div>

    </main>


    <!-- ================= PROFILE ================= -->

    <main id="profilePage" class="page hidden">

      <div class="profileBox glass">

        <div
          class="bigAvatar"
          id="profileAvatar">
          U
        </div>

        <div
          class="profileName"
          id="profileUsername">
          Username
        </div>

        <div
          class="profileEmail"
          id="profileEmail">
          email
        </div>

        <button
          class="btn secondary logout"
          id="logoutBtn">
          Logout
        </button>

      </div>

    </main>


    <!-- ================= NAV ================= -->

    <nav class="bottomNav glass">

      <div
        class="navPill"
        id="navPill">
      </div>

      <div
        class="navItem active"
        data-page="home">
        Home
      </div>

      <div
        class="navItem"
        data-page="chat">
        Chat
      </div>

      <div
        class="navItem"
        data-page="profile">
        Profile
      </div>

    </nav>

  </div>


  <!-- ================= CHAT OVERLAY ================= -->

  <div id="chatOverlay"></div>


  <!-- ================= CHAT DRAWER ================= -->

  <aside id="chatDrawer">

    <div class="chatHeader">

      <button
        class="backBtn"
        id="closeChatBtn">
        ←
      </button>

      <div class="avatar" id="chatAvatar">
        U
      </div>

      <div class="chatUser">

        <div
          class="chatUserName"
          id="chatUsername">
          User
        </div>

        <div class="chatUserStatus">
          ChatX user
        </div>

      </div>

    </div>


    <div id="messages"></div>


    <div class="composer">

      <input
        id="messageInput"
        class="messageInput"
        type="text"
        maxlength="2000"
        placeholder="Message...">

      <button
        id="sendBtn"
        class="sendBtn">

      </button>

  <!-- EDGE SWIPE -->

  <div id="edgeZone"></div>


  <!-- TOAST -->

  <div id="toast"></div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ktzlnjehfbjzrqtgwxee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sxrL1sGY22smdk3uSd1F1g_wdEngxGA";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let selectedUser = null;

let realtimeChannel = null;

const renderedMessageIds =
  new Set();


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
  document.getElementById("loading");

const authPage =
  document.getElementById("authPage");

const mainShell =
  document.getElementById("mainShell");

const loginForm =
  document.getElementById("loginForm");

const signupForm =
  document.getElementById("signupForm");

const errorBox =
  document.getElementById("errorBox");

const searchInput =
  document.getElementById("searchInput");

const userResults =
  document.getElementById("userResults");

const chatDrawer =
  document.getElementById("chatDrawer");

const chatOverlay =
  document.getElementById("chatOverlay");

const edgeZone =
  document.getElementById("edgeZone");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const toast =
  document.getElementById("toast");

const navPill =
  document.getElementById("navPill");


/* =========================================================
   HELPERS
========================================================= */

function showError(message){

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";
}


function clearError(){

  errorBox.textContent =
    "";

  errorBox.style.display =
    "none";
}


function showToast(message){

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {

      toast.classList.remove("show");

    },2200);
}


function getInitial(name){

  return (
    name?.trim()?.charAt(0)?.toUpperCase()
    || "U"
  );
}


function escapeTime(date){

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}


/* =========================================================
   AUTH FORM SWITCH
========================================================= */

document
  .getElementById("showSignup")
  .addEventListener("click",() => {

    clearError();

    loginForm.classList.add("hidden");
    signupForm.classList.remove("hidden");

  });


document
  .getElementById("showLogin")
  .addEventListener("click",() => {

    clearError();

    signupForm.classList.add("hidden");
    loginForm.classList.remove("hidden");

  });


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(user,username){

  const clean =
    username.trim();

  if(!clean){
    return;
  }

  const {error} =
    await db
      .from("profiles")
      .upsert(
        {
          id:user.id,
          username:clean
        },
        {
          onConflict:"id"
        }
      );

  if(error){

    console.error(
      "Profile save error:",
      error
    );

  }
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(user){

  const {data,error} =
    await db
      .from("profiles")
      .select("id,username")
      .eq("id",user.id)
      .maybeSingle();

  if(error){

    console.error(
      "Profile load error:",
      error
    );

  }

  if(data){

    currentProfile =
      data;

    return data;
  }


  const metadataUsername =
    user.user_metadata?.username
    || "User";


  await saveProfile(
    user,
    metadataUsername
  );


  currentProfile = {
    id:user.id,
    username:metadataUsername
  };


  return currentProfile;
}


/* =========================================================
   SIGN UP
========================================================= */

async function handleSignup(){

  clearError();

  const username =
    document
      .getElementById("signupUsername")
      .value
      .trim();

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;


  if(!username){

    showError(
      "Please enter a username."
    );

    return;
  }


  if(username.length < 3){

    showError(
      "Username must be at least 3 characters."
    );

    return;
  }


  if(!email){

    showError(
      "Please enter your email."
    );

    return;
  }


  if(password.length < 6){

    showError(
      "Password must be at least 6 characters."
    );

    return;
  }


  const {data,error} =
    await db.auth.signUp({

      email,
      password,

      options:{
        data:{
          username
        }
      }

    });


  if(error){

    showError(
      error.message
    );

    return;
  }


  if(data.user){

    if(data.session){

      await saveProfile(
        data.user,
        username
      );

      showToast(
        "Account created!"
      );

    }else{

      showToast(
        "Check your email to confirm your account."
      );

    }

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function handleLogin(){

  clearError();

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    showError(
      "Enter email and password."
    );

    return;
  }


  const {data,error} =
    await db.auth.signInWithPassword({

      email,
      password

    });


  if(error){

    showError(
      error.message
    );

    return;
  }


  if(data.user){

    await enterApp(
      data.user
    );

  }

}


/* =========================================================
   SESSION
========================================================= */

async function checkSession(){

  const {data,error} =
    await db.auth.getSession();

  if(error){

    console.error(error);

  }


  if(data.session?.user){

    await enterApp(
      data.session.user
    );

  }else{

    showAuth();

  }

}


async function enterApp(user){

  currentUser =
    user;

  await loadProfile(
    user
  );


  authPage.classList.add(
    "hidden"
  );

  mainShell.classList.remove(
    "hidden"
  );

  loading.classList.add(
    "hidden"
  );


  updateProfileUI();

  showPage("home");

}


function showAuth(){

  loading.classList.add(
    "hidden"
  );

  mainShell.classList.add(
    "hidden"
  );

  authPage.classList.remove(
    "hidden"
  );

}


/* =========================================================
   PROFILE UI
========================================================= */

function updateProfileUI(){

  const username =
    currentProfile?.username
    || "User";


  document
    .getElementById("helloText")
    .textContent =
      "Hello, " + username + " 👋";


  document
    .getElementById("profileUsername")
    .textContent =
      username;


  document
    .getElementById("profileEmail")
    .textContent =
      currentUser?.email
      || "";


  document
    .getElementById("profileAvatar")
    .textContent =
      getInitial(username);

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(page){

  document
    .getElementById("homePage")
    .classList.add("hidden");

  document
    .getElementById("profilePage")
    .classList.add("hidden");


  if(page === "home"){

    document
      .getElementById("homePage")
      .classList.remove("hidden");

    navPill.style.transform =
      "translateX(0%)";

  }


  if(page === "profile"){

    document
      .getElementById("profilePage")
      .classList.remove("hidden");

    navPill.style.transform =
      "translateX(200%)";

  }


  document
    .querySelectorAll(".navItem")
    .forEach(item => {

      item.classList.toggle(
        "active",
        item.dataset.page === page
      );

    });


  if(page === "chat"){

    showToast(
      selectedUser
        ? "Swipe from right edge ← to open chat"
        : "Search a user first"
    );

  }

}


document
  .querySelectorAll(".navItem")
  .forEach(item => {

    item.addEventListener(
      "click",
      () => {

        const page =
          item.dataset.page;

        if(page === "chat"){

          showToast(
            selectedUser
              ? "Swipe from right edge ← to open chat"
              : "Search a user first"
          );

          return;
        }

        showPage(page);

      }
    );

  });


document
  .getElementById("headerProfile")
  .addEventListener(
    "click",
    () => showPage("profile")
  );


/* =========================================================
   USER SEARCH
========================================================= */

let searchTimer = null;


searchInput
  .addEventListener(
    "input",
    () => {

      clearTimeout(
        searchTimer
      );

      searchTimer =
        setTimeout(
          searchUsers,
          250
        );

    }
  );


async function searchUsers(){

  const query =
    searchInput.value.trim();


  userResults.innerHTML =
    "";


  if(!query){

    return;
  }


  if(!currentUser){

    return;
  }


  const {data,error} =
    await db
      .from("profiles")
      .select(
        "id,username"
      )
      .ilike(
        "username",
        `%${query}%`
      )
      .neq(
        "id",
        currentUser.id
      )
      .limit(20);


  if(error){

    console.error(error);

    showToast(
      "Search failed"
    );

    return;
  }


  if(!data?.length){

    userResults.innerHTML = `
      <div style="
        text-align:center;
        color:#666;
        padding:30px;
        font-size:13px;
      ">
        No users found
      </div>
    `;

    return;
  }


  data.forEach(user => {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "userCard glass";

    card.style.pointerEvents =
      "auto";


    card.innerHTML = `
      <div class="avatar">
        ${getInitial(user.username)}
      </div>

      <div class="userInfo">

        <div class="username">
          ${escapeHTML(user.username)}
        </div>

        <div class="userStatus">
          ChatX user
        </div>

      </div>
    `;


    card.addEventListener(
      "click",
      () => {

        selectUser(user);

      }
    );


    userResults.appendChild(
      card
    );

  });

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   SELECT USER
========================================================= */

function selectUser(user){

  selectedUser =
    user;


  document
    .getElementById("chatUsername")
    .textContent =
      user.username;


  document
    .getElementById("chatAvatar")
    .textContent =
      getInitial(
        user.username
      );


  showToast(
    "User selected — swipe from right edge →"
  );

}


/* =========================================================
   OPEN CHAT
========================================================= */

async function openChat(){

  if(!selectedUser){

    showToast(
      "Search and select a user first"
    );

    return;
  }


  chatDrawer.classList.add(
    "open"
  );

  chatOverlay.classList.add(
    "open"
  );

  mainShell.classList.add(
    "chatOpen"
  );


  edgeZone.style.pointerEvents =
    "none";


  await loadConversation();

}


/* =========================================================
   CLOSE CHAT
========================================================= */

function closeChat(){

  chatDrawer.classList.remove(
    "open"
  );

  chatOverlay.classList.remove(
    "open"
  );

  mainShell.classList.remove(
    "chatOpen"
  );


  edgeZone.style.pointerEvents =
    "auto";


  resetDrawerGesture();

}


/* =========================================================
   CHAT BUTTONS
========================================================= */

document
  .getElementById("closeChatBtn")
  .addEventListener(
    "click",
    closeChat
  );


chatOverlay
  .addEventListener(
    "click",
    closeChat
  );


/* =========================================================
   LOAD CONVERSATION
========================================================= */

async function loadConversation(){

  if(!currentUser ||
     !selectedUser){

    return;
  }


  messages.innerHTML =
    "";

  renderedMessageIds.clear();


  if(realtimeChannel){

    await db.removeChannel(
      realtimeChannel
    );

    realtimeChannel =
      null;
  }


  const filter =
    `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedUser.id}),and(sender_id.eq.${selectedUser.id},receiver_id.eq.${currentUser.id})`;


  const {data,error} =
    await db
      .from("messages")
      .select(
        "id,sender_id,receiver_id,content,created_at"
      )
      .or(filter)
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(error);

    showToast(
      "Could not load messages"
    );

    return;
  }


  data?.forEach(
    renderMessage
  );


  scrollMessages();


  subscribeRealtime();

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(message){

  if(!message?.id){

    return;
  }


  if(
    renderedMessageIds
      .has(message.id)
  ){

    return;
  }


  renderedMessageIds.add(
    message.id
  );


  const wrapper =
    document.createElement(
      "div"
    );


  const mine =
    message.sender_id ===
    currentUser.id;


  wrapper.className =
    "message " +
    (mine
      ? "mine"
      : "theirs");


  const content =
    document.createElement(
      "div"
    );

  content.textContent =
    message.content;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "messageTime";

  time.textContent =
    escapeTime(
      message.created_at
    );


  wrapper.appendChild(
    content
  );

  wrapper.appendChild(
    time
  );


  messages.appendChild(
    wrapper
  );


  scrollMessages();

}


/* =========================================================
   SCROLL
========================================================= */

function scrollMessages(){

  requestAnimationFrame(
    () => {

      messages.scrollTop =
        messages.scrollHeight;

    }
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(
    !currentUser ||
    !selectedUser
  ){

    return;
  }


  const text =
    messageInput.value.trim();


  if(!text){

    return;
  }


  messageInput.value =
    "";


  const {data,error} =
    await db
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          selectedUser.id,

        content:
          text

      })
      .select(
        "id,sender_id,receiver_id,content,created_at"
      )
      .single();


  if(error){

    console.error(
      "Send error:",
      error
    );

    messageInput.value =
      text;

    showToast(
      "Message failed to send"
    );

    return;
  }


  if(data){

    renderMessage(
      data
    );

  }

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  if(
    !currentUser ||
    !selectedUser
  ){

    return;
  }


  const myId =
    currentUser.id;

  const otherId =
    selectedUser.id;


  realtimeChannel =
    db
      .channel(
        `chat-${myId}-${otherId}-${Date.now()}`
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload => {

          const message =
            payload.new;


          const belongsToChat =
            (
              message.sender_id === myId &&
              message.receiver_id === otherId
            )
            ||
            (
              message.sender_id === otherId &&
              message.receiver_id === myId
            );


          if(
            belongsToChat
          ){

            renderMessage(
              message
            );

          }

        }
      )
      .subscribe(
        status => {

          console.log(
            "Realtime:",
            status
          );

        }
      );

}


/* =========================================================
   RIGHT EDGE SWIPE OPEN
========================================================= */

let edgeStartX = 0;
let edgeStartY = 0;
let edgeTracking = false;


edgeZone.addEventListener(
  "pointerdown",
  event => {

    if(
      chatDrawer.classList.contains(
        "open"
      )
    ){

      return;
    }


    edgeTracking = true;

    edgeStartX =
      event.clientX;

    edgeStartY =
      event.clientY;


    edgeZone.setPointerCapture(
      event.pointerId
    );

  }
);


edgeZone.addEventListener(
  "pointerup",
  event => {

    if(!edgeTracking){

      return;
    }


    edgeTracking = false;


    const dx =
      event.clientX -
      edgeStartX;

    const dy =
      event.clientY -
      edgeStartY;


    if(
      dx < -55 &&
      Math.abs(dx) >
      Math.abs(dy)
    ){

      openChat();

    }

  }
);


/* =========================================================
   CHAT DRAWER SWIPE CLOSE
========================================================= */

let drawerStartX = 0;
let drawerStartY = 0;
let drawerTracking = false;


chatDrawer.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target.closest(
        "input,button"
      )
    ){

      return;
    }


    drawerTracking = true;

    drawerStartX =
      event.clientX;

    drawerStartY =
      event.clientY;

    chatDrawer.style.transition =
      "none";

  }
);


chatDrawer.addEventListener(
  "pointerup",
  event => {

    if(!drawerTracking){

      return;
    }


    drawerTracking = false;


    const dx =
      event.clientX -
      drawerStartX;

    const dy =
      event.clientY -
      drawerStartY;


    chatDrawer.style.transition =
      "";


    if(
      dx > 90 &&
      Math.abs(dx) >
      Math.abs(dy)
    ){

      closeChat();

    }

  }
);


function resetDrawerGesture(){

  chatDrawer.style.transform =
    "";

  chatDrawer.style.transition =
    "";

}


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      closeChat();


      if(realtimeChannel){

        await db.removeChannel(
          realtimeChannel
        );

        realtimeChannel =
          null;

      }


      await db.auth.signOut();


      currentUser =
        null;

      currentProfile =
        null;

      selectedUser =
        null;


      showAuth();

    }
  );


/* =========================================================
   AUTH BUTTONS
========================================================= */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    handleLogin
  );


document
  .getElementById("signupBtn")
  .addEventListener(
    "click",
    handleSignup
  );


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
  async (event,session) => {

    console.log(
      "Auth:",
      event
    );

    if(
      event === "SIGNED_IN" &&
      session?.user
    ){

      await enterApp(
        session.user
      );

    }


    if(
      event === "SIGNED_OUT"
    ){

      showAuth();

    }

  }
);


/* =========================================================
   START
========================================================= */

checkSession();

</script>
